name: Deploy to GitHub Pages

# 저장소 루트의 정적 문서(index/saju/wedding)와 app/ 의 Vite 빌드 산출물을
# 하나의 Pages 아티팩트로 합쳐 배포한다.
#   https://haliacoast-sys.github.io/wedding/          -> 루트 index.html
#   https://haliacoast-sys.github.io/wedding/saju.html -> 루트 saju.html
#   https://haliacoast-sys.github.io/wedding/app/      -> app/dist/

on:
  push:
    branches: [main]
  # 변수 등록 직후처럼 커밋 없이 다시 돌려야 할 때가 있어 수동 실행도 열어 둔다.
  workflow_dispatch:

permissions:
  contents: read # 소스 체크아웃용. 저장소에 쓰지 않는다.
  pages: write # Pages 배포 생성
  id-token: write # deploy-pages 가 OIDC 토큰으로 배포를 인증한다

# 배포는 순서가 보장돼야 하므로 한 번에 하나만 돌린다.
# cancel-in-progress 를 켜면 이미 게시 중인 배포가 중간에 끊겨
# 사이트가 반쯤 갱신된 상태로 남을 수 있어 false 로 둔다. 뒤 실행은 큐에서 대기한다.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: 소스 체크아웃
        uses: actions/checkout@v7

      # 빌드가 성공해도 이 두 값이 비면 런타임에 app/src/lib/supabase.ts 가 throw 해서
      # 앱이 흰 화면으로 죽는다. 배포 후에야 알게 되는 걸 막으려고 빌드 전에 먼저 끊는다.
      # 두 값 모두 클라이언트 번들에 그대로 실려 나가는 공개 값이라 secrets 가 아닌 vars 로 받는다.
      - name: 필수 저장소 변수 확인
        env:
          VITE_SUPABASE_URL: ${{ vars.VITE_SUPABASE_URL }}
          VITE_SUPABASE_PUBLISHABLE_KEY: ${{ vars.VITE_SUPABASE_PUBLISHABLE_KEY }}
        run: |
          # ${missing:+...} 로 앞에 값이 있을 때만 구분자를 붙여 목록을 만든다.
          missing=""
          [ -n "$VITE_SUPABASE_URL" ] || missing="${missing:+$missing, }VITE_SUPABASE_URL"
          [ -n "$VITE_SUPABASE_PUBLISHABLE_KEY" ] || missing="${missing:+$missing, }VITE_SUPABASE_PUBLISHABLE_KEY"

          if [ -n "$missing" ]; then
            echo "::error title=저장소 변수 누락::비어 있는 변수: $missing"
            {
              echo "### 배포 중단: 저장소 변수가 비어 있습니다"
              echo
              echo "비어 있는 변수: \`$missing\`"
              echo
              echo "이 값이 없으면 빌드는 통과하지만 배포된 앱이 런타임에 죽습니다"
              echo "(\`app/src/lib/supabase.ts\` 가 예외를 던집니다)."
              echo
              echo "Settings > Secrets and variables > Actions > **Variables** 탭에 등록하세요."
              echo "(Secrets 탭이 아닙니다. 클라이언트 번들에 실리는 공개 값입니다.)"
              echo
              echo '```sh'
              echo 'gh variable set VITE_SUPABASE_URL --repo haliacoast-sys/wedding --body "https://<project-ref>.supabase.co"'
              echo 'gh variable set VITE_SUPABASE_PUBLISHABLE_KEY --repo haliacoast-sys/wedding --body "<publishable-key>"'
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi

          echo "저장소 변수 확인 완료 (VITE_SUPABASE_URL = ${#VITE_SUPABASE_URL}자, VITE_SUPABASE_PUBLISHABLE_KEY = ${#VITE_SUPABASE_PUBLISHABLE_KEY}자)"

      - name: Node 22 설정
        uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
          # lock 파일이 저장소 루트가 아니라 app/ 에 있어서 기본 탐색으로는 캐시 키를 못 만든다.
          cache-dependency-path: app/package-lock.json

      - name: 의존성 설치
        working-directory: app
        # lock 파일 그대로 재현 설치. package.json 과 어긋나면 조용히 넘어가지 않고 실패한다.
        run: npm ci

      - name: 앱 빌드
        working-directory: app
        env:
          # Vite 는 빌드 시점에 VITE_ 접두사 환경변수를 번들에 정적 치환한다.
          # 따라서 이 값은 배포 후 바꿀 수 없고, 바꾸려면 다시 빌드해야 한다.
          VITE_SUPABASE_URL: ${{ vars.VITE_SUPABASE_URL }}
          VITE_SUPABASE_PUBLISHABLE_KEY: ${{ vars.VITE_SUPABASE_PUBLISHABLE_KEY }}
        run: npm run build

      # 배포할 것만 _site 로 골라 담는다(화이트리스트).
      # 저장소를 통째로 올리면 tools/ 의 파이썬 스크립트와 supabase/ 마이그레이션까지
      # 공개 사이트에 그대로 노출되므로, 제외가 아니라 포함 방식으로 만든다.
      - name: 배포 산출물 스테이징
        run: |
          rm -rf _site
          mkdir -p _site/app

          # 루트 정적 문서. 문서가 추가돼도 워크플로를 고칠 필요 없게 glob 으로 받는다.
          # 최상위 *.html 만 잡히므로 하위 디렉터리는 딸려오지 않는다.
          cp ./*.html _site/

          # Jekyll 은 _ 로 시작하는 파일·디렉터리를 빌드 대상으로 삼아 삼켜버린다.
          # Vite 에셋에 그런 이름이 생길 수 있으므로 .nojekyll 은 산출물 루트에 반드시 있어야 한다.
          # 루트 파일이 지워지는 사고가 나도 배포본에는 남도록 여기서 직접 보장한다.
          cp .nojekyll _site/.nojekyll 2>/dev/null || touch _site/.nojekyll

          # app/dist 의 "내용"을 _site/app 아래로. 뒤의 /. 이 없으면 _site/app/dist 가 된다.
          # vite.config.ts 의 base 가 '/wedding/app/' 라서 이 경로여야 에셋이 맞는다.
          cp -R app/dist/. _site/app/

          echo "--- _site 구조 ---"
          find _site -maxdepth 2 -mindepth 1 | sort

      # 위 단계가 조용히 어긋났을 때 잘못된 사이트를 게시하는 것보다 여기서 끊는 게 낫다.
      - name: 산출물 검증
        run: |
          fail=0
          for f in _site/.nojekyll _site/index.html _site/saju.html _site/wedding.html _site/app/index.html; do
            if [ ! -f "$f" ]; then
              echo "::error title=산출물 누락::$f 가 없습니다"
              fail=1
            fi
          done
          [ "$fail" -eq 0 ]

      - name: Pages 설정 로드
        uses: actions/configure-pages@v6

      - name: Pages 아티팩트 업로드
        uses: actions/upload-pages-artifact@v5
        with:
          path: _site
          # v4 부터 점으로 시작하는 파일이 tar 에서 기본 제외된다.
          # 이 옵션이 없으면 위에서 만든 .nojekyll 이 아티팩트에서 사라진다.
          include-hidden-files: true

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: GitHub Pages 배포
        id: deployment
        uses: actions/deploy-pages@v5
